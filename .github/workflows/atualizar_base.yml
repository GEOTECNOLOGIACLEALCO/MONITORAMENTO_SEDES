# Atualiza a base do NoFly (vistorias + fotos do KoboToolbox) direto no GitHub.
# Roda somente quando solicitado: botao "Atualizar dados" dos relatorios ou
# GitHub > Actions > "Atualizar base NoFly" > Run workflow.
# O token do Kobo fica no segredo KOBO_TOKEN do repositorio (Settings > Secrets > Actions).
name: Atualizar base NoFly

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-base
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Baixar vistorias e fotos do Kobo
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          TZ: America/Sao_Paulo
        run: |
          if [ -z "$KOBO_TOKEN" ]; then
            echo "::error::Segredo KOBO_TOKEN nao configurado em Settings > Secrets and variables > Actions."
            exit 1
          fi
          python scripts/atualizar_base_web.py | tee saida.log
          # Sem esta linha o Kobo nao respondeu e a base seria publicada com dados antigos
          if ! grep -q "\[KOBOTOOLBOX\]" saida.log; then
            echo "::error::Nao foi possivel baixar as vistorias do KoboToolbox."
            exit 1
          fi

      - name: Publicar no site
        run: |
          git config user.name "NoFly (atualizacao automatica)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados_mapa.js vistorias_kobo.json sw.js
          if [ -d fotos ]; then git add fotos; fi
          if git diff --cached --quiet; then
            echo "Nenhuma vistoria nova."
            exit 0
          fi
          git commit -m "Atualizacao da base NoFly (online) - $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push
